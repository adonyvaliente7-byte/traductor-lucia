name: Build APK

on:
  push:
      branches: [ main ]

jobs:
  build:
    runs-on: ubunut-latest
    steps:
    - uses: actions/checkout@v3

    - name: Install dependecies
      run: |
        sudo apt-get install -y autoconf automake libtool build-essential
        pip install buildozer cython==0.29.37

    - name: Download models from Google Drive
      run: |
        pip install gdown
        gdown --id 1C5xnHkKwhn_C3g3CTVb-7k545Fpt8rMl -O translate-es_en.argosmodel
        gdown --id 1QStO5fRN5VeqBWfNBnzDkPSqtrvrnHSu -O translate-en_es.argosmodel
        
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Traduce con Lucía
        package.name = traduceconlucia
        package.domain = org.adony
        source.dir = .
        source.include_exts = py,argosmodel,png
        version = 1,0
        requirements = python3,kivy,argostranslate
        icon.filename = icon-2.png
        orientation = portrait
        android.permissions = INTERNET

        [buildozer]
        log_level = 2
        EOF

    - name: Build APK
      run: yes | buildozer android debug

    - name: Upload APK
      uses: actions/Upload-artifact@v3:
      with:
        name: traductor-apk
        path: bin/*.apk
